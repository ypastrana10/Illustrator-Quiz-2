<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Illustrator Quiz 2 — Appearance &amp; Color</title>
<style>
*{box-sizing:border-box}body{font:17px system-ui,Arial,sans-serif;background:#eef3fa;color:#142b47;margin:0;padding:20px}.wrap{max-width:850px;margin:auto;background:white;padding:28px;border-radius:14px;box-shadow:0 5px 22px #b5c3d3}h1{color:#183e75}.muted{color:#52667c}fieldset{border:1px solid #c8d6e7;border-radius:10px;margin:18px 0;padding:18px}legend{font-weight:700;padding:0 6px}label{display:block;padding:11px;border:1px solid #d5e0ec;margin:7px 0;border-radius:8px;cursor:pointer}label:has(input:checked){background:#e7f2ff;border-color:#1b4c91}label.good{background:#e1f6e6;border-color:#15804b}label.bad{background:#ffe5e5;border-color:#b83333}input{margin-right:9px}button{background:#1b4c91;color:white;border:0;padding:12px 20px;border-radius:8px;font-size:16px;cursor:pointer;margin:6px 8px 6px 0}.secondary{background:#e7edf6;color:#173e73}#notice{color:#a32727;font-weight:700}#result{font-size:22px;font-weight:700;margin:16px 0}.feedback{font-size:14px;margin-top:8px}.progress{font-weight:600;color:#385b7f}@media(max-width:600px){body{padding:0}.wrap{border-radius:0;padding:16px}}@media print{button,#notice{display:none}body{background:white}.wrap{box-shadow:none}}
</style></head><body><main class="wrap"><h1>Illustrator Quiz 2: Appearance &amp; Color</h1><p class="muted">Gareth David Studio • Episodes 5–7 • 15 questions</p><p id="progress" class="progress">0 of 15 answered</p><div id="notice" role="alert"></div><form id="quiz"></form><button id="submit" type="button">Submit &amp; See Score</button><button id="retake" class="secondary" type="button">Retake Quiz</button><button id="print" class="secondary" type="button" hidden>Print Results</button><div id="result" role="status" aria-live="polite"></div></main>
<script>
const Q=[{"question": "What is a fill in Illustrator?", "options": ["Document bleed", "A group mask", "Color or pattern inside a shape", "Line around the shape"], "answer": 2}, {"question": "What is a stroke?", "options": ["Color inside a path", "A saved artboard", "A raster filter", "Outline along a path"], "answer": 3}, {"question": "Which control changes outline thickness?", "options": ["Stroke Weight", "Tracking", "Opacity Mask", "Artboard Count"], "answer": 0}, {"question": "Which panel stores reusable colors?", "options": ["Paragraph", "Swatches", "Links", "Navigator"], "answer": 1}, {"question": "What is a gradient?", "options": ["A vector anchor type", "A document preset", "A gradual transition between colors", "A fixed solid color"], "answer": 2}, {"question": "What does the Eyedropper Tool help copy?", "options": ["The artboard dimensions", "The undo history", "The file location", "Appearance attributes from artwork"], "answer": 3}, {"question": "Which color mode is generally preferred for print documents?", "options": ["CMYK", "RGB", "Indexed Color", "Bitmap"], "answer": 0}, {"question": "Which color mode is generally used for screen graphics?", "options": ["Spot Color only", "RGB", "CMYK", "Grayscale only"], "answer": 1}, {"question": "What is a Pantone color commonly used for?", "options": ["Converting text into paragraphs", "Automatically removing backgrounds", "Consistent standardized spot-color specification", "Increasing anchor-point count"], "answer": 2}, {"question": "What does a linear gradient follow?", "options": ["Only the shape outline", "A circular path from center", "Random brush marks", "A straight direction across an object"], "answer": 3}, {"question": "Which panel controls detailed stroke properties?", "options": ["Stroke", "Character", "Links", "Transparency Grid"], "answer": 0}, {"question": "What does reducing opacity do?", "options": ["Converts text to outlines", "Makes artwork more transparent", "Changes artboard dimensions", "Adds anchor points"], "answer": 1}, {"question": "What does Arrange > Bring to Front change?", "options": ["Number of artboards", "Font family", "Object stacking order", "Document color mode"], "answer": 2}, {"question": "What does Shift typically do while dragging a corner of many shape tools?", "options": ["Delete the fill", "Turn off guides", "Merge all layers", "Constrain proportions"], "answer": 3}, {"question": "Which command can repeat the last transformation in Illustrator?", "options": ["Transform Again", "Image Trace", "Outline Stroke", "Package"], "answer": 0}];
const form=document.getElementById('quiz'),progress=document.getElementById('progress'),notice=document.getElementById('notice'),result=document.getElementById('result');
let submitted=false;
function build(){form.replaceChildren();Q.forEach((q,i)=>{const fs=document.createElement('fieldset');const legend=document.createElement('legend');legend.textContent=(i+1)+'. '+q.question;fs.append(legend);q.options.forEach((opt,j)=>{const label=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=String(j);input.addEventListener('change',updateProgress);label.append(input,document.createTextNode(String.fromCharCode(65+j)+'. '+opt));fs.append(label)});const feedback=document.createElement('div');feedback.className='feedback';fs.append(feedback);form.append(fs)});updateProgress()}
function chosen(i){const el=form.querySelector('input[name="q'+i+'"]:checked');return el?Number(el.value):null}
function updateProgress(){progress.textContent=Q.filter((q,i)=>chosen(i)!==null).length+' of '+Q.length+' answered';notice.textContent=''}
function grade(){if(submitted)return;const missing=Q.map((q,i)=>chosen(i)===null?i+1:null).filter(x=>x!==null);if(missing.length){notice.textContent='Please answer question'+(missing.length===1?' ':'s ')+missing.join(', ')+' before submitting.';form.children[missing[0]-1].scrollIntoView({behavior:'smooth',block:'center'});return}submitted=true;let score=0;Q.forEach((q,i)=>{const fs=form.children[i],answer=chosen(i),correct=answer===q.answer;if(correct)score++;fs.querySelectorAll('label').forEach((label,j)=>{label.classList.toggle('good',j===q.answer);label.classList.toggle('bad',j===answer&&!correct)});fs.querySelector('.feedback').textContent=(correct?'Correct. ':'Incorrect. ')+'Correct answer: '+String.fromCharCode(65+q.answer)+'. '+q.options[q.answer];fs.querySelectorAll('input').forEach(input=>input.disabled=true)});result.textContent='Your score: '+score+' / '+Q.length+' ('+Math.round(score/Q.length*100)+'%). Green = correct answer; red = incorrect selection.';document.getElementById('submit').disabled=true;document.getElementById('print').hidden=false;result.scrollIntoView({behavior:'smooth',block:'center'})}
function retake(){submitted=false;result.textContent='';notice.textContent='';document.getElementById('submit').disabled=false;document.getElementById('print').hidden=true;build();window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('submit').addEventListener('click',grade);document.getElementById('retake').addEventListener('click',retake);document.getElementById('print').addEventListener('click',()=>window.print());build();
</script></body></html>
